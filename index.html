<head>
<!-- VERSION: v0.7 各關主題色套用共用光影:天空 8 階抖色漸層、主題光源(與星點同層視差 0.15,登記淡泛光)、背景霧兩條、地形後方環境粒子(每大關一種)、前景薄霧與暈影(像素畫法,高低畫質皆開);第 7 大關主題色改破曉前藍調晨霧;判定與機制不變 -->
<!-- 前版:v0.6 特攻機制改版(使用者授權):轟炸機 P2 自畫面左緣飛入、鎖定標記 L2 琥珀、左下通訊字幕 T3、機腹投放追蹤飛彈 M2(尾跡 R3、爆炸 X1)命中才結算;魔王 4 枚各扣總血量 2%(最高優先級)、6 王目標選單、魔王登場期間不能施放 -->
<!-- 前版:v0.5.2 敵彈拿掉深色描邊(仍畫在泛光之後;描邊只留在主角衝鋒槍與散彈彈頭);其餘同 v0.5.1 -->
<!-- 前版:v0.5.1 火焰遮蔽修正(敵彈移到泛光之後並加深色描邊/火焰外層半透明 0.55、發光只留槍口三分之一段、火星不發光/燃燒敵人改深色剪影加火焰對比色外框,Lv1~3 在火焰下層、Lv4 在火焰上層;子彈命中閃白不變;判定與機制不變) -->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXEL STRIKE FORCE (PC)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;background:#05060a;overflow:hidden;font-family:"Courier New",ui-monospace,monospace}
#wrap{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:#05060a;
 padding-bottom:env(safe-area-inset-bottom)}
#screen{position:relative}
canvas{image-rendering:-webkit-optimize-contrast;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated;display:block}
/* ===== HUD:改為 DOM 疊層,避免畫布縮放造成文字模糊 ===== */
#hud{position:absolute;left:0;top:0;width:100%;display:flex;align-items:center;justify-content:space-between;
 gap:1.1vmin;padding:calc(.8vmin + env(safe-area-inset-top)) calc(1.3vmin + env(safe-area-inset-right)) .8vmin calc(1.3vmin + env(safe-area-inset-left));
 background:rgba(3,5,12,.94);border-bottom:1px solid rgba(150,180,255,.30);
 font-family:"Consolas","Courier New","Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans CJK TC",monospace;font-weight:700;color:#f4f7ff; /* v0.3.1:與畫布文字 TFONT 同一組字型 */
 font-size:clamp(12px,2.8vmin,19px);letter-spacing:0;pointer-events:none;z-index:5;box-sizing:border-box;
 text-shadow:0 1px 2px rgba(0,0,0,.9);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#hud .grp{display:flex;align-items:center;gap:.5em;white-space:nowrap}
#hLifeIcons{font-size:.82em;letter-spacing:-1px}
#hLifeIcons b{color:#ff4a6a;margin-right:0}
#hLifeIcons b.off{color:#2a3245}
#hWepDot{display:inline-block;width:.9em;height:.9em;border-radius:2px;margin-right:.3em;vertical-align:-.1em}
#hSpTrack{display:inline-block;width:6.4em;height:.7em;background:#1a2233;border-radius:2px;overflow:hidden;vertical-align:middle}
#hSpFill{display:block;height:100%;background:#ff6ad0;width:0%}
#hSpFill.rdy{background:#fff}
#hStage{color:#dbe4f8}
@media (max-width:640px){#hud{font-size:clamp(11px,3.1vmin,16px);gap:.7vmin}#hSpTrack{width:4em}}
/* ===== F3 效能面板與畫質切換提示(DOM 疊層,不進入畫布與泛光) ===== */
#perf{position:absolute;left:6px;bottom:6px;display:none;padding:4px 7px;background:rgba(0,0,0,.72);
 color:#9fffdc;font:12px/1.35 "Consolas","Courier New","Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans CJK TC",monospace;white-space:pre;pointer-events:none;z-index:6;border-radius:3px}
#fxToast{position:absolute;left:50%;top:16%;transform:translateX(-50%);display:none;padding:5px 12px;
 background:rgba(3,5,12,.85);border:1px solid rgba(150,180,255,.35);color:#ffe9a0;
 font:bold 14px "Consolas","Courier New","Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans CJK TC",monospace;pointer-events:none;z-index:6;border-radius:3px}

<body>
<div id="wrap">
 <div id="screen">
  <canvas id="c"></canvas>
  <div id="hud" style="display:none">
   <div class="grp" id="hScore">SCORE 0000000</div>
   <div class="grp">LIFE <span id="hLifeIcons"></span></div>
   <div class="grp"><i id="hWepDot"></i><span id="hWepName">SMG Lv1</span></div>
   <div class="grp">SP <span id="hSpTrack"><span id="hSpFill"></span></span><span id="hSpPct">0%</span></div>
   <div class="grp" id="hStage">1-1</div>
  </div>
  <div id="perf"></div>
  <div id="fxToast"></div>
 </div>
</div>
<script>
'use strict';
/* ========== 基礎 ========== */
const W=512,H=288,TS=16,GH=18;
/* 畫布分工(v0.2 起):
   - gcv / ctx:遊戲邏輯畫面 512×288,所有既有繪圖程式照舊畫在這裡(座標、判定完全不變)
   - glc / gctx:離屏發光層 512×288,只畫會發光的東西(透過 gl() 登記)
   - cv / octx:螢幕上看得到的輸出畫布,後製流程在這裡合成(見「特效核心層」) */
const cv=document.getElementById('c'),octx=cv.getContext('2d');
const gcv=document.createElement('canvas');gcv.width=W;gcv.height=H;
const ctx=gcv.getContext('2d');ctx.imageSmoothingEnabled=false;
const glc=document.createElement('canvas');glc.width=W;glc.height=H;
const gctx=glc.getContext('2d');
const screenEl=document.getElementById('screen');
const POST_MAX_W=2560;  // 輸出畫布寬度上限(超過時以整數倍交給 CSS 放大,例如 4K 螢幕)
let PW=W,PH=H;          // 輸出畫布實際解析度
function vpSize(){
  return[innerWidth,innerHeight];
}
function fit(){
  const [vw,vh]=vpSize();
  const s=Math.min(vw/W,vh/H);           // 不再強制下限為 1,避免可視高度較小時畫面被裁切
  const cw=Math.round(W*s),ch=Math.round(H*s);
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  screenEl.style.width=cw+'px';screenEl.style.height=ch+'px';
  // 輸出畫布對齊實體像素:遊戲畫面只做一次最近鄰放大(512→實體像素),像素格大小與 v0.1 交給瀏覽器放大時相同
  const dpr=window.devicePixelRatio||1;
  const physW=Math.max(1,Math.round(cw*dpr)),physH=Math.max(1,Math.round(ch*dpr));
  const k=Math.max(1,Math.ceil(physW/POST_MAX_W));
  const nw=Math.max(1,Math.round(physW/k)),nh=Math.max(1,Math.round(physH/k));
  if(nw!==PW||nh!==PH||cv.width!==nw){PW=nw;PH=nh;cv.width=PW;cv.height=PH;}
}
addEventListener('resize',fit);
fit();

const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
let PXD=0; // 本段 gcv 是否有畫任何方塊(後製第二段:沒畫就省掉一次全畫面合成;文字不算,文字直接畫在輸出畫布)
/* ===== 文字層(v0.3):文字改在輸出畫布以螢幕解析度畫,不再畫進 512×288 再放大 =====
   - txt() 的參數與座標完全照舊(512×288 邏輯座標),第二段(HUD/疊層)呼叫時只排進佇列 TQ
   - 佇列在 tFlush() 寫出:先把 gcv 上已畫的面板放大合成到輸出畫布,再以 PW/W 倍率直接畫字
   - 之後若有方塊(px)會蓋到已排隊的文字,先自動 tFlush,保持與 v0.2 相同的上下順序(例:暫停暗幕蓋住遊戲訊息)
   - 字型:英數用等寬粗體(Consolas,無則 Courier New),中文由瀏覽器逐字退回微軟正黑體(Mac 為蘋方)
   - ol=1:加 1 個邏輯像素寬的深色描邊,用在直接浮在場景上的文字 */
const TFONT='"Consolas","Courier New","Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans CJK TC",monospace';
const TOUT='#05060a';
const TQ=[];let TPASS=0; // TPASS=1:目前在第二段(HUD/疊層),txt 走佇列
function tHit(x,y,w,h){for(let i=0;i<TQ.length;i++){const t=TQ[i];if(x<t.x1&&x+w>t.x0&&y<t.y1&&y+h>t.y0)return true;}return false;}
function px(x,y,w,h,c){if(TQ.length&&tHit(x,y,w,h))tFlush();
  PXD=1;ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function txt(s,x,y,c,size,align,ol){
  size=size||8;align=align||'left';
  if(!TPASS){ // 世界繪製階段(目前已無呼叫點)維持舊做法,畫在遊戲畫布上
    PXD=1;ctx.fillStyle=c;ctx.font='bold '+size+'px '+TFONT;
    ctx.textAlign=align;ctx.textBaseline='top';ctx.fillText(s,Math.round(x),Math.round(y));ctx.textAlign='left';return;}
  const w=s.length*size;                      // 寬度以每字 1 個字級粗估(偏大,只用於重疊判斷)
  const x0=align==='center'?x-w/2:(align==='right'?x-w:x);
  TQ.push({s,x,y,c,size,align,ol:!!ol,a:ctx.globalAlpha,x0:x0,x1:x0+w,y0:y,y1:y+size*1.3});
}
function tFlush(){
  if(PXD){octx.imageSmoothingEnabled=false;octx.drawImage(gcv,0,0,PW,PH);ctx.clearRect(0,0,W,H);PXD=0;}
  if(!TQ.length)return;
  const kx=PW/W,ky=PH/H;
  octx.textBaseline='top';octx.lineJoin='round';
  for(let i=0;i<TQ.length;i++){const t=TQ[i];
    octx.font='bold '+Math.max(1,Math.round(t.size*ky))+'px '+TFONT;
    octx.textAlign=t.align;octx.globalAlpha=t.a;
    const X=Math.round(t.x*kx),Y=Math.round(t.y*ky);
    if(t.ol){octx.strokeStyle=TOUT;octx.lineWidth=Math.max(2,Math.round(2*ky));octx.strokeText(t.s,X,Y);}
    octx.fillStyle=t.c;octx.fillText(t.s,X,Y);
  }
  octx.globalAlpha=1;octx.textAlign='left';TQ.length=0;
}
function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

/* ========== 輸入 ========== */
const K={l:0,r:0,u:0,d:0,j:0,f:0,s:0};
let jE=false,sE=false,uE=false,anyTap=false,lastTapT=0;
let pj=0,ps=0,pu=0;
function edges(){jE=K.j&&!pj;sE=K.s&&!ps;uE=K.u&&!pu;pj=K.j;ps=K.s;pu=K.u;}


const KM={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',KeyA:'l',KeyD:'r',KeyW:'u',KeyS:'d',
  KeyZ:'f',KeyX:'j',KeyC:'s',Space:'j',KeyJ:'f',KeyK:'j',KeyL:'s'};
addEventListener('keydown',e=>{
  if(e.code==='F2'){e.preventDefault();if(!e.repeat)toggleQuality();return;}   // 畫質 高/低 切換
  if(e.code==='F3'){e.preventDefault();if(!e.repeat)togglePerf();return;}      // 效能面板(同時擋掉瀏覽器的「尋找下一個」)
  if(G.modal&&G.modal.spPick&&G.state==='play'){                                 // v0.6:6 王特攻目標選單,1/2/3 選擇、Esc 取消
    const k={Digit1:'k',Digit2:'c',Digit3:'avg',Numpad1:'k',Numpad2:'c',Numpad3:'avg'}[e.code];
    if(k){e.preventDefault();spPick(k);return;}
    if(e.code==='Escape'){e.preventDefault();G.modal=null;return;}
  }
  if(KM[e.code]){K[KM[e.code]]=1;e.preventDefault();}if(e.code==='Enter')anyTap=true;
  if((e.code==='Escape'||e.code==='KeyP')&&G.state!=='title'&&G.state!=='levelselect'&&!G.modal)G.paused=!G.paused;});
addEventListener('keyup',e=>{if(KM[e.code])K[KM[e.code]]=0;});
function toGameXY(clientX,clientY){
  const r=cv.getBoundingClientRect();
  return [(clientX-r.left)/r.width*W,(clientY-r.top)/r.height*H];
}
document.getElementById('wrap').addEventListener('pointerdown',e=>{
  if(G.state==='title'){anyTap=true;return;}
  if(G.state==='levelselect'){
    const [gx,gy]=toGameXY(e.clientX,e.clientY);
    const lsShift=0; // 觸控裝置:整組往下移,避免「正常開局」被裝置頂部區域擋住點不到
    const nx=(W-200)/2,ny=34+lsShift,nw=200,nh=30;
    if(gx>=nx&&gx<=nx+nw&&gy>=ny&&gy<=ny+nh){startGame();return;}
    const cols=5,bw=84,bh=46,gap=8,gwid=cols*bw+(cols-1)*gap,x0=(W-gwid)/2,y0=128+lsShift;
    for(let i=0;i<10;i++){
      const col=i%cols,row=Math.floor(i/cols);
      const bx=x0+col*(bw+gap),by=y0+row*(bh+gap);
      if(gx>=bx&&gx<=bx+bw&&gy>=by&&gy<=by+bh){debugStartWorld(i+1);return;}
    }
    return;
  }
  if(G.state==='over'&&G.sT>=90){
    const [gx,gy]=toGameXY(e.clientX,e.clientY);
    const by=H/2+30,bw=64,bh=22,yesX=W/2-80,noX=W/2+16;
    if(gy>=by&&gy<=by+bh){
      if(gx>=yesX&&gx<=yesX+bw){ // 是:接續挑戰
        if(G.overBoss&&bossSnapshot){
          G.world=bossSnapshot.world;G.sub=bossSnapshot.sub;G.score=bossSnapshot.score;
          P.lives=bossSnapshot.lives;wep=bossSnapshot.wep;wlvl=bossSnapshot.wlvl;
          hudEl.style.display='flex';startBoss();G.state='intro';G.sT=0;
        }else{
          G.sub=1;P.lives=5;wep='smg';wlvl=1;G.charge=0;
          hudEl.style.display='flex';startLevel();
        }
        return;
      }
      if(gx>=noX&&gx<=noX+bw){toTitle();return;}
    }
    return;
  }
  if(G.state!=='play')return;
  if(G.modal){
    const [gx,gy]=toGameXY(e.clientX,e.clientY);
    if(G.modal.choose){ // 7-1 進場彈種二選一
      const [a,b]=G.modal.choose,by=H/2-8,bh=26;
      if(gy>=by&&gy<=by+bh){
        if(gx>=W/2-92&&gx<=W/2-8){wep=a;wlvl=2;G.msg=WNAME[wep]+' Lv2';G.msgT=70;G.modal=null;return;}
        if(gx>=W/2+8&&gx<=W/2+92){wep=b;wlvl=2;G.msg=WNAME[wep]+' Lv2';G.msgT=70;G.modal=null;return;}
      }
      return;
    }
    if(G.modal.spPick){ // v0.6:6 王特攻目標
      if(gy>=H/2-8&&gy<=H/2+14){
        if(gx>=W/2-100&&gx<=W/2-40){spPick('k');return;}
        if(gx>=W/2-30&&gx<=W/2+30){spPick('c');return;}
        if(gx>=W/2+40&&gx<=W/2+100){spPick('avg');return;}
      }
      if(gy>=H/2+20&&gy<=H/2+38&&gx>=W/2-32&&gx<=W/2+32){G.modal=null;return;}
      return;
    }
    const by=H/2+6,bw=64,bh=22,yesX=W/2-80,noX=W/2+16;
    if(gy>=by&&gy<=by+bh){
      if(gx>=yesX&&gx<=yesX+bw){wep=G.modal.wt;wlvl=(wep==='smg')?2:1;G.msg=WNAME[wep]+' Lv'+wlvl;G.msgT=70;G.modal=null;return;}
      if(gx>=noX&&gx<=noX+bw){G.modal=null;return;}
    }
    return;
  }
  // 滑鼠連點2下(350ms內)也可暫停/繼續;鍵盤 P / Esc 亦可
  const nowT=performance.now();
  if(nowT-lastTapT<350){lastTapT=0;G.paused=!G.paused;}
  else lastTapT=nowT;
});

/* ========== 地圖 ========== */
// 0 空 / 1 實心 / 2 藤蔓 / 3 單向平台 / 4 水(減速) / 5 灼燒面 / 6 可消失平台
let map={w:32,h:GH,d:new Int8Array(32*GH)};
function T(x,y){if(y<0)return 0;if(y>=map.h)return 0;if(x<0||x>=map.w)return 1;return map.d[y*map.w+x];}
function setT(x,y,v){if(x<0||y<0||x>=map.w||y>=map.h)return;map.d[y*map.w+x]=v;}
function newMap(w){map={w:w,h:GH,d:new Int8Array(w*GH)};}
function fillR(x0,y0,x1,y1,v){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)setT(x,y,v);}
function vineAt(x,y0,y1){for(let y=y0;y<=y1;y++)if(T(x,y)===0)setT(x,y,2);}
function isSolid(t){return t===1||t===6;}
function hitSolid(x,y,w,h){
  const x0=Math.floor(x/TS),x1=Math.floor((x+w-1)/TS),y0=Math.floor(y/TS),y1=Math.floor((y+h-1)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(isSolid(T(tx,ty)))return true;
  return false;
}
function tileKind(x,y,w,h,kind){
  const x0=Math.floor(x/TS),x1=Math.floor((x+w-1)/TS),y0=Math.floor(y/TS),y1=Math.floor((y+h-1)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(T(tx,ty)===kind)return true;
  return false;
}
/* 地面型敵人用:判斷前方一定深度內是否有地面(避免踩空掉入無底坑),以及尋找最近地面 Y */
function groundAhead(x,y,h,limitTiles){
  const tx=Math.floor(x/TS),ty0=Math.floor((y+h)/TS);
  if(T(tx,ty0)===5)return false; // 傷害地形(其下通常是坑)一律視為懸崖,強制觸發折返,避免敵人踩入/卡在裡面
  for(let i=0;i<=limitTiles;i++){const t=T(tx,ty0+i);if(isSolid(t)||t===3)return true;}
  return false;
}
function findGroundY(x){
  const tx=Math.floor(x/TS);
  for(let ty=0;ty<GH;ty++){const t=T(tx,ty);if(isSolid(t)||t===3)return ty*TS;}
  return null;
}
function safeGroundY(x){ // 站上去撿道具時,身體所在那格不能是傷害地形(尖刺等)
  const gy=findGroundY(x);
  if(gy==null)return null;
  const tx=Math.floor(x/TS),bodyRow=Math.floor(gy/TS)-1;
  if(T(tx,bodyRow)===5)return null;
  return gy;
}
let cam={x:0,y:0};
/* ========== 遊戲全域狀態 ========== */
const G={
  state:'title', world:1, sub:1, score:0, charge:0,
  t:0, sT:0, flash:0, shakeT:0, shakeM:0, invertT:0, msg:'', msgT:0,
  paused:false, modal:null, overBoss:false
};
const BASE_DMG=12;                 // 初始單排衝鋒槍每發傷害(原10 x1.2)
const SP_MULT_MOB=20, SP_MULT_BOSS=5;  // v0.6 特攻改版後已不使用(魔王改為每枚扣總血量 2%、雜兵保證擊殺)

const P={x:48,y:120,vx:0,vy:0,w:10,h:14,face:1,onG:false,climb:false,inv:0,lives:5,
  fireCd:0,flameT:0,safeX:48,safeY:120,dead:false,anim:0};
let wep='smg',wlvl=1;             // smg / flame / shot
const WCOL={smg:'#ffd24a',flame:'#ff5a3c',shot:'#c07bff'};
const WNAME={smg:'SMG',flame:'FLAME',shot:'SHOT'};

let bul=[],ebul=[],ens=[],items=[],parts=[],hazs=[],plane=null,portal=null,boss=null;

function resetRun(){
  G.world=1;G.sub=1;G.score=0;G.charge=0;P.lives=5;wep='smg';wlvl=1;G.paused=false;G.modal=null;
}
function addPart(x,y,vx,vy,c,life,sz){parts.push({x,y,vx,vy,c,life,t:0,sz:sz||2});}
function burst(x,y,c,n,pw){for(let i=0;i<(n||8);i++){const a=rnd(0,6.283),s=rnd(.5,pw||2.2);
  addPart(x,y,Math.cos(a)*s,Math.sin(a)*s,c,ri(14,28));}}
function shake(m,t){G.shakeM=Math.max(G.shakeM,m);G.shakeT=Math.max(G.shakeT,t);}

/* ========== 主角 ========== */
function playerBox(){return {x:P.x,y:P.y,w:P.w,h:P.h};}
function hurtPlayer(){
  if(P.inv>0||G.state!=='play')return;
  P.lives--;P.inv=72;shake(4,16);
  burst(P.x+5,P.y+7,'#ff5566',14,3);
  P.vy=-3.2;P.vx=-P.face*2;P.climb=false;
  if(P.lives<=0){G.state='over';G.sT=0;G.overBoss=!!(boss&&boss.alive);}
}
function moveX(dx){
  const st=Math.sign(dx);let n=Math.abs(dx);
  while(n>0){const s=Math.min(1,n);
    if(hitSolid(P.x+st*s,P.y,P.w,P.h)){P.vx=0;break;}
    P.x+=st*s;n-=s;}
  P.x=clamp(P.x,0,map.w*TS-P.w);
}
function moveY(dy){
  const st=Math.sign(dy);let n=Math.abs(dy);
  while(n>0){const s=Math.min(1,n);const ny=P.y+st*s;
    if(hitSolid(P.x,ny,P.w,P.h)){if(st>0)P.onG=true;P.vy=0;break;}
    if(st>0&&!K.d){ // 單向平台
      const by=Math.floor((ny+P.h-1)/TS);
      let land=false;
      for(let tx=Math.floor(P.x/TS);tx<=Math.floor((P.x+P.w-1)/TS);tx++)
        if(T(tx,by)===3&&(P.y+P.h)<=by*TS+2)land=true;
      if(land){P.onG=true;P.vy=0;break;}
    }
    P.y=ny;n-=s;}
}
function aimVec(){
  const up=K.u&&!P.climb;
  if(up&&(K.l||K.r))return[P.face*0.7071,-0.7071];
  if(up)return[0,-1];
  return[P.face,0];
}
function updatePlayer(){
  if(P.inv>0)P.inv--;
  if(G.invertT>0)G.invertT--;
  const inv=G.invertT>0;
  const kl=inv?K.r:K.l, kr=inv?K.l:K.r;

  const cxT=Math.floor((P.x+P.w/2)/TS);
  const onVine=T(cxT,Math.floor((P.y+3)/TS))===2||T(cxT,Math.floor((P.y+P.h-3)/TS))===2;
  if(P.climb){
    if(!onVine||jE){P.climb=false;if(jE){P.vy=-5.2;P.onG=false;}}
    else{
      P.vy=0;
      if(K.u)P.y-=1.3;if(K.d)P.y+=1.3;
      if(kl){P.face=-1;}if(kr){P.face=1;}
      P.y=clamp(P.y,0,map.h*TS-P.h);
      if(hitSolid(P.x,P.y,P.w,P.h)&&K.d)P.y-=1.3;
      P.anim+=0.12;
    }
  }
  if(!P.climb&&onVine&&(K.u||K.d)&&!K.j){
    P.climb=true;P.x=cxT*TS+TS/2-P.w/2;P.onG=false;
  }
  if(!P.climb){
    const water=tileKind(P.x,P.y,P.w,P.h,4);
    const sp=water?1.25:1.7;
    const tgt=kl?-sp:(kr?sp:0);
    P.vx+=(tgt-P.vx)*(tgt?0.55:0.4);
    if(kl)P.face=-1;else if(kr)P.face=1;
    P.vy+=water?0.24:0.36;if(P.vy>7.5)P.vy=7.5;
    if(jE&&P.onG){P.vy=water?-5.0:-6.05;P.onG=false;}
    P.onG=false;
    moveX(P.vx+(G.conveyor||0));
    moveY(P.vy);
    if(Math.abs(P.vx)>0.2&&P.onG)P.anim+=0.22;else P.anim=0;
    if(tileKind(P.x,P.y+2,P.w,P.h,5))hurtPlayer();
  }
  if(P.onG||P.climb){P.safeX=P.x;P.safeY=P.y;}
  if(P.y>map.h*TS+30){hurtPlayer();P.x=P.safeX;P.y=P.safeY-4;P.vy=0;P.vx=0;}
  updateWeapon();
}

/* ========== 武器 ========== */
function flameRange(){return wlvl===1?64:((wlvl===2||wlvl===3)?128:192);}  // wlvl4(限7關後 smg/flame):再x1.5
function shotRange(){return flameRange();}    // 與火焰槍同倍率(4階時flameRange()已是3階x1.5=192,散彈同步套用)
function shotSpread(){return wlvl===1?45:(wlvl===2?65:(wlvl===4?97.5:65));}  // 4階:3階的1.5倍
function muzzle(){const a=aimVec();return [P.x+P.w/2+a[0]*7,P.y+6+a[1]*6];}

function updateWeapon(){
  if(P.fireCd>0)P.fireCd--;
  P.flameT=Math.max(0,P.flameT-1);
  if(!K.f)return;
  const a=aimVec(),m=muzzle();
  if(wep==='smg'){
    if(P.fireCd>0)return;
    P.fireCd=14;
    const d=wlvl===4?BASE_DMG*2.4:(wlvl===3?BASE_DMG*1.2:BASE_DMG); // 4階:3階傷害的2倍
    const offs=wlvl===1?[0]:(wlvl===2?[-3.5,3.5]:[-5,0,5]);         // 4階判定範圍同3階
    const col=wlvl===4?'#ffd700':'#ffe9a0';                         // 4階:彈幕改金色
    const nx=-a[1],ny=a[0];
    for(const o of offs)
      bul.push({x:m[0]+nx*o,y:m[1]+ny*o,vx:a[0]*6.2,vy:a[1]*6.2,dmg:d,r:3.4,c:col,life:70});
  }else if(wep==='flame'){
    P.flameT=4;
  }else{
    if(P.fireCd>0)return;
    P.fireCd=20;
    const per=wlvl===4?BASE_DMG*3:(wlvl===3?BASE_DMG*2:BASE_DMG*1.2); // 4階:3階傷害的1.5倍
    const half=shotSpread()/2*Math.PI/180, base=Math.atan2(a[1],a[0]);
    const life=Math.round(shotRange()/5);
    const col=wlvl===4?'#ff0033':'#e0b6ff'; // 4階:紅色,選用與敵方常見紅/橘/粉紅攻擊色不同的高飽和正紅以利區隔
    for(let i=0;i<5;i++){
      const ang=base+rnd(-half,half);
      bul.push({x:m[0],y:m[1],vx:Math.cos(ang)*5,vy:Math.sin(ang)*5,dmg:per,r:2.6,c:col,life:life});
    }
  }
}
function flameHit(o){ // o:{x,y,w,h}
  if(P.flameT<=0)return false;
  const a=aimVec(),m=muzzle(),L=flameRange();
  const cx=o.x+o.w/2-m[0],cy=o.y+o.h/2-m[1];
  const d=cx*a[0]+cy*a[1];
  if(d<-4||d>L)return false;
  const perp=Math.abs(-cy*a[0]+cx*a[1]);
  return perp<10+d*0.34;
}
function flameDPS(){return BASE_DMG*6*(wlvl===4?6.75:(wlvl===3?4.5:2.4));}  // 每秒(4階:3階x1.5)
/* ========== 武器視覺(v0.5,純視覺:不改判定、射程、傷害與子彈出生點) ==========
   - 彈頭:菱形+深色描邊,依 32 個方向預先畫成小圖快取(HEADC),每顆子彈每幀只貼一張圖;拖尾 4 段漸細,只畫在彈頭後方
   - 火焰:連續火舌(外層破碎交錯)+火星+尾端煙;視覺寬約為判定錐一半(判定照舊為 flameHit 的錐形)
     v0.5.1:外層兩團半透明(0.55),發光只登記靠槍口三分之一段,火星不發光,讓敵彈與敵人維持畫面最亮的層級
   - 槍口:前長後短十字星,3 幀遞減;命中:白閃 2 幀+3 片武器色碎片向後回彈(走既有粒子系統) */
function vHash(a,b){let h=(a*374761393+b*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vRgb(c){const n=parseInt(c.slice(1),16);return[n>>16,n>>8&255,n&255];}
function vHex(r,g,b){return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
function vMix(c,k,t){const[r,g,b]=vRgb(c);return vHex(Math.round(r+(t-r)*k),Math.round(g+(t-g)*k),Math.round(b+(t-b)*k));}
const HEADC=new Map(),HR=6;
function headSprite(col,r,ang){
  const nb=32,bi=((Math.round(ang/(Math.PI*2)*nb)%nb)+nb)%nb,key=col+r+'|'+bi;
  let s=HEADC.get(key);if(s)return s;
  const a=bi/nb*Math.PI*2,ux=Math.cos(a),uy=Math.sin(a),L=r>3?4.5:3.5,Wd=r>3?2.2:1.6,N=HR*2+1;
  const inside=(al,pe,k)=>Math.abs(al)/(L*k)+Math.abs(pe)/(Wd*k)<=1;
  const m=new Uint8Array(N*N);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const dx=i-HR,dy=j-HR,al=dx*ux+dy*uy,pe=-dx*uy+dy*ux;
    if(inside(al,pe,1))m[j*N+i]=inside(al-L*0.25,pe,0.55)?2:1;}
  s=document.createElement('canvas');s.width=N;s.height=N;const x=s.getContext('2d');
  const core=vMix(col,0.7,255),dark=vMix(col,0.6,0);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const v=m[j*N+i];let c=null;
    if(v===2)c=core;else if(v===1)c=col;
    else if((i>0&&m[j*N+i-1])||(i<N-1&&m[j*N+i+1])||(j>0&&m[(j-1)*N+i])||(j<N-1&&m[(j+1)*N+i]))c=dark;
    if(c){x.fillStyle=c;x.fillRect(i,j,1,1);}}
  HEADC.set(key,s);return s;
}
const TRAIL_B=[[3,0.6],[2,0.45],[2,0.3],[1,0.18]],TRAIL_S=[[2,0.6],[2,0.4],[1,0.28],[1,0.16]];
function drawBulletV(b){
  if(b.a0===undefined)b.a0=G.t;                       // 只供視覺:出現的時間,用來限制拖尾不畫到槍口後方
  const sp=Math.hypot(b.vx,b.vy)||1,ux=b.vx/sp,uy=b.vy/sp,big=b.r>3,L=big?4.5:3.5,trav=(G.t-b.a0+1)*sp;
  const T=big?TRAIL_B:TRAIL_S;
  for(let k=0;k<4;k++){const d=L+(k+0.6)*2.3;if(d>trav)break;const s=T[k][0];
    ctx.globalAlpha=T[k][1];px(b.x-ux*d-s/2,b.y-uy*d-s/2,s,s,b.c);}
  ctx.globalAlpha=1;
  ctx.drawImage(headSprite(b.c,b.r,Math.atan2(b.vy,b.vx)),Math.round(b.x)-HR,Math.round(b.y)-HR);
}
function hitFx(b){                                     // 命中:白閃 2 幀+3 片武器色碎片向後回彈(只新增粒子,不影響判定)
  const sp=Math.hypot(b.vx,b.vy)||1,ux=b.vx/sp,uy=b.vy/sp;
  addPart(b.x-1,b.y-1,0,0,'#ffffff',2,3);
  for(let i=0;i<3;i++){const v=rnd(0.6,2);
    addPart(b.x,b.y,-ux*v+rnd(-0.8,0.8),-uy*v+rnd(-1.6,0.4),b.c,14,ri(1,2));}
}
/* 火焰:HOT[等級]=[白熱、主色、外色、尾端暗色] */
const HOT={1:['#fff0a0','#ff9a2a','#ff3a10','#7a1a08'],3:['#9fd8ff','#5aa8ff','#2a5cff','#142a7a'],4:['#ffffff','#cfeaff','#7ab8ff','#3a5a9a']};
const FLV={sp:[],sm:[]};                               // 火星與煙(純視覺,只在遊玩中推進)
function fSq(x,y,h,c){h=Math.max(1,h);px(x-h,y-h,h*2,h*2,c);}
function drawFlame(){
  const run=G.state==='play'&&!G.paused&&!G.modal;
  const on=P.flameT>0,lv=wlvl===4?4:(wlvl===3?3:1),H_=HOT[lv];
  let a=null,m=null,L=0;
  if(on){a=aimVec();m=muzzle();L=flameRange();}
  if(run){
    if(on){const n=Math.random()<0.5?2:1;
      for(let i=0;i<n;i++){const d=rnd(0.2,0.95)*L,sd=rnd(-1,1)*(2.5+d*0.15);
        FLV.sp.push({x:m[0]+a[0]*d-a[1]*sd,y:m[1]+a[1]*d+a[0]*sd,vx:a[0]*rnd(0.8,1.8)-a[1]*sd*0.05,vy:a[1]*rnd(0.8,1.8)+a[0]*sd*0.05-0.3,t:0,life:ri(10,20),c:H_[0]});}
      if((G.t&1)===0){const d=rnd(0.75,1)*L;
        FLV.sm.push({x:m[0]+a[0]*d,y:m[1]+a[1]*d,vx:a[0]*0.5,vy:a[1]*0.5-0.35,t:0,life:ri(24,40),c:lv===1?'#2c2630':'#3a4258'});}}
    for(let i=FLV.sp.length-1;i>=0;i--){const q=FLV.sp[i];q.x+=q.vx;q.y+=q.vy;q.vy-=0.02;if(++q.t>=q.life)FLV.sp.splice(i,1);}
    for(let i=FLV.sm.length-1;i>=0;i--){const q=FLV.sm[i];q.x+=q.vx;q.y+=q.vy;if(++q.t>=q.life)FLV.sm.splice(i,1);}
  }
  for(const q of FLV.sm){const k=q.t/q.life,z=3+k*5;ctx.globalAlpha=0.45*(1-k);px(q.x-z/2,q.y-z/2,z,z,q.c);}
  ctx.globalAlpha=1;
  if(on){
    const a0=a[0],a1=a[1],st=3,n=Math.floor(L/st),t=G.t,pts=[];
    for(let k=0;k<=n;k++){const d=k*st,f=d/L,fl=vHash(k*7+lv,t/3|0);
      if(f>0.82&&fl<0.35)continue;
      let hw=(2.5+d*0.15)*(0.78+0.4*fl);if(f>0.85)hw*=1-(f-0.85)/0.15*0.55;
      const wob=Math.sin(t*0.25-d*0.09)*Math.min(d,60)*0.06;
      pts.push({x:m[0]+a0*d-a1*wob,y:m[1]+a1*d+a0*wob,hw,f,k});}
    for(let i=pts.length-1;i>=0;i--){const q=pts[i];if(q.f>0.3&&(q.k+(t>>2))%2)continue; // 外層:上下兩團交錯跳格,邊緣破碎
      const c=q.f<0.35?H_[1]:(q.f<0.72?H_[2]:H_[3]),o=q.hw*0.5,j=(vHash(q.k,t>>2)-0.5)*q.hw*0.4;
      ctx.globalAlpha=0.55*(1-0.35*q.f);fSq(q.x-a1*(o+j),q.y+a0*(o+j),q.hw*0.5,c);fSq(q.x+a1*(o-j),q.y-a0*(o-j),q.hw*0.5,c);}
    ctx.globalAlpha=1;
    for(let i=pts.length-1;i>=0;i--){const q=pts[i];if(q.f<=0.75)fSq(q.x,q.y,q.hw*0.45,q.f<0.4?H_[0]:H_[1]);}
    for(const q of pts)if(q.f<=0.3)fSq(q.x,q.y,q.hw*0.2,'#ffffff');
    for(const q of pts)if(q.k%3===0&&q.f<=0.34)gl(q.x-q.hw-2,q.y-q.hw-2,q.hw*2+4,q.hw*2+4,H_[1],FX.core*0.7); // 發光層:火焰(v0.5.1 只登記靠槍口三分之一段)
  }
  for(const q of FLV.sp){const k=1-q.t/q.life;ctx.globalAlpha=k;px(q.x,q.y,q.t<4?2:1,1,q.c);} // v0.5.1:火星不再登記發光
  ctx.globalAlpha=1;
}
/* 槍口火光(v0.5 改為前長後短十字星):衝鋒槍/散彈槍開火後 3 幀遞減、火焰槍噴射期間小幅閃爍,顏色跟武器 */
function drawMuzzle(){
  let c=null,age=0;
  if(wep==='smg'&&P.fireCd>11){c=wlvl===4?'#ffd700':'#ffe9a0';age=14-P.fireCd;}
  else if(wep==='shot'&&P.fireCd>17){c=wlvl===4?'#ff0033':'#e0b6ff';age=20-P.fireCd;}
  else if(wep==='flame'&&P.flameT>0){c=wlvl===4?'#ffffff':(wlvl===3?'#9fd8ff':'#ff9a2a');age=1+((G.t>>1)&1);}
  if(!c)return;
  age=clamp(age,0,2);
  const a=aimVec(),m=muzzle(),mx=Math.round(m[0]),my=Math.round(m[1]),A=[[6,3],[4,2],[2,1]][age],nx=-a[1],ny=a[0];
  for(let k=2;k<2+A[0];k++)px(mx+a[0]*k,my+a[1]*k,1,1,c);           // 前方長臂
  px(mx-a[0]*2,my-a[1]*2,1,1,c);                                      // 後方短臂
  for(let k=2;k<2+A[1];k++){px(mx+nx*k,my+ny*k,1,1,c);px(mx-nx*k,my-ny*k,1,1,c);} // 兩側
  px(mx-1,my-1,3,3,age<2?'#fffbe8':c);
  gl(mx-5+a[0]*A[0]/2,my-5+a[1]*A[0]/2,10,10,c,0.8);
}
/* ========== 危險區(通用攻擊判定) ========== */
// {x,y,w,h,warn,live,c,t,follow}
function haz(x,y,w,h,warn,live,c){hazs.push({x,y,w,h,warn:Math.round(warn*1.7)+10,live,c:c||'#ff5a3c',t:0});return hazs[hazs.length-1];}
function updateHazards(){
  for(let i=hazs.length-1;i>=0;i--){
    const z=hazs[i];z.t++;
    if(z.t>z.warn){ // 警示期間位置固定,進入生效期才開始移動,確保玩家看到的預警=真正命中位置
      if(z.vx)z.x+=z.vx;if(z.vy)z.y+=z.vy;
      if(z.t<=z.warn+z.live){ if(aabb(playerBox(),z))hurtPlayer(); }
      else{hazs.splice(i,1);}
    }
  }
}
function drawHazards(){
  for(const z of hazs){
    const x=z.x;
    if(z.t<=z.warn){
      if((z.t>>2)&1){ctx.globalAlpha=.55;px(x,z.y,z.w,z.h,z.c);ctx.globalAlpha=1;}
      ctx.strokeStyle=z.c;ctx.lineWidth=1;ctx.strokeRect(Math.round(x)+.5,Math.round(z.y)+.5,z.w-1,z.h-1);
    }else{
      ctx.globalAlpha=.85;px(x,z.y,z.w,z.h,z.c);ctx.globalAlpha=1;
      px(x,z.y,z.w,2,'#fff');
    }
  }
}
/* ========== 敵人 ========== */
function enemyHP(type){
  const wm=1+0.16*(G.world-1)+0.05*(G.sub-1);
  const base={grunt:180,runner:120,turret:260,flyer:140,bee:70,skel:110,drone:90,mortar:240}[type]||150;
  return Math.round(base*wm);
}
function addEnemy(type,x,y,opt){
  const e={type,x,y,w:12,h:14,vx:0,vy:0,t:ri(0,60),hp:enemyHP(type),fx:0,dead:false,dt:0};
  if(type==='turret'||type==='mortar'){e.w=14;e.h=14;}
  if(type==='flyer'||type==='bee'||type==='drone'){e.w=14;e.h=10;e.y0=y;}
  if(opt)Object.assign(e,opt);
  ens.push(e);return e;
}
function eb(x,y,vx,vy,r,c,owner){ebul.push({x,y,vx:vx*0.55,vy:vy*0.55,r:r||3,c:c||'#ff8adf',t:0,life:430,owner});}

function updateEnemies(){
  for(let i=ens.length-1;i>=0;i--){
    const e=ens[i];
    // 掉出地圖外(墜落無底坑):直接移除,不計擊殺不掉落,避免卡在畫面外變相拖長關卡
    if(e.y>map.h*TS+60){ens.splice(i,1);continue;}
    // 保底機制:不論成因(生成點誤判、擊退推入、地形動態轉換等),只要敵人本體疊到傷害地形(灼燒面/尖刺),
    // 直接視為被燒滅淘汰,避免卡在裡面出不去(比只擋巡邏路徑更保險,徹底排除卡住的可能)
    if(tileKind(e.x,e.y,e.w,e.h,5)){killEnemy(e,i);continue;}
    e.t++;if(e.fx>0)e.fx--;
    const near=Math.abs(e.x-(cam.x+W/2))<W*0.75;
    if(near){
      const dx=(P.x+5)-(e.x+e.w/2), dy=(P.y+7)-(e.y+e.h/2);
      if(e.type==='grunt'){
        if(!e.dir)e.dir=dx<0?-1:1;
        e.x+=e.dir*0.24;
        if(hitSolid(e.x,e.y,e.w,e.h)||!hitSolid(e.x+(e.dir>0?e.w:-2),e.y+e.h+2,2,2))
          {e.x-=e.dir*0.24;e.dir*=-1;}
        e.face=dx<0?-1:1;
        if(e.t%(180-G.world*3)===0&&Math.abs(dy)<26&&Math.abs(dx)<210){
          const n=Math.hypot(dx,dy)||1;eb(e.x+6,e.y+6,dx/n*1.5,dy/n*1.5,3,'#ffd0a0',e);
        }
      }else if(e.type==='runner'||e.type==='skel'){
        // 改為地形巡航(類似瑪利歐 Goomba):固定方向行走,遇牆或懸崖才轉向,不再直接朝玩家水平位移
        const s=e.type==='skel'?0.42:0.6;
        if(!e.dir)e.dir=dx<0?-1:1;
        const nx=e.x+e.dir*s;
        const aheadX=e.dir>0?nx+e.w:nx-2;
        if(hitSolid(nx,e.y,e.w,e.h)||!groundAhead(aheadX,e.y,e.h,4)){e.dir*=-1;}
        else e.x=nx;
        e.face=e.dir;
        e.vy=(e.vy||0)+0.36;e.y+=e.vy;
        if(hitSolid(e.x,e.y,e.w,e.h)){e.y-=e.vy;e.vy=0;}
      }else if(e.type==='turret'){
        e.face=dx<0?-1:1;
        if(e.t%150<3&&e.t%150>0&&Math.abs(dx)<240){
          const n=Math.hypot(dx,dy)||1;eb(e.x+7,e.y+7,dx/n*1.7,dy/n*1.7,3,'#a0e0ff',e);
        }
      }else if(e.type==='mortar'){ // 定點,拋物線落彈,考驗走位而非反應
        e.face=dx<0?-1:1;
        if(e.t%170===2&&Math.abs(dx)<260){
          const Tt=70,g=0.15,tx=P.x+5+rnd(-16,16);
          ebul.push({x:e.x+7,y:e.y+2,vx:(tx-(e.x+7))/Tt,vy:-0.5*g*Tt,r:4,c:'#ffb86a',t:0,life:Tt+20,g,owner:e});
        }
      }else if(e.type==='flyer'){
        e.x+=Math.sign(dx)*0.28;
        e.y=(e.y0||e.y)+Math.sin(e.t*0.05)*20;
        e.face=Math.sign(dx)||1;
        if(e.t%210===0)eb(e.x+7,e.y+10,0,1.4,3,'#ffa0c0',e);
      }else if(e.type==='bee'){
        if(e.boss5){ // 5王專屬召喚:主動飛向玩家,但保持攻擊距離,不會硬擠到玩家身上
          const dist=Math.hypot(dx,dy)||1;
          if(dist>28){e.x+=dx/dist*1.0;e.y+=dy/dist*1.0;}
          else{e.x+=Math.sin(e.t*0.1)*0.6;e.y+=Math.cos(e.t*0.1)*0.6;}
          e.face=Math.sign(dx)||1;
        }else{ // 一般小關的蜂維持原本徘徊行為,不受5王機制影響
          e.x+=Math.sign(dx)*0.4;e.y=(e.y0||e.y)+Math.sin(e.t*0.05)*20;e.face=Math.sign(dx)||1;
        }
      }else if(e.type==='drone'){
        const n=Math.hypot(dx,dy)||1;e.x+=dx/n*0.7;e.y+=dy/n*0.7;
      }
      if(aabb(playerBox(),e))hurtPlayer();
    }
    // 火焰持續傷害
    if(flameHit(e)){e.hp-=flameDPS()/60;e.fx=2;
      if(Math.random()<0.3)addPart(e.x+6,e.y+6,rnd(-1,1),rnd(-1.4,0),'#ffcc66',14);}
    if(e.hp<=0){killEnemy(e,i);}
  }
}
function nearestGroundX(x){ // 找最近有地面可安全站立撿取的欄位(避開傷害地形)
  if(safeGroundY(x)!=null)return x;
  for(let d=TS;d<=20*TS;d+=TS){
    if(safeGroundY(x-d)!=null)return x-d;
    if(safeGroundY(x+d)!=null)return x+d;
  }
  return null;
}
function killEnemy(e,i){
  ens.splice(i,1);
  for(let k=ebul.length-1;k>=0;k--)if(ebul[k].owner===e)ebul.splice(k,1); // 敵人死亡時,其射出的子彈一併消失
  burst(e.x+6,e.y+7,'#ffb15a',10,2.4);
  G.score+=100;G.charge=Math.min(100,G.charge+5);
  if(e.noDrop)return;
  const gx=nearestGroundX(e.x+6);
  if(gx==null)return; // 附近完全沒有可站立的地面(例如懸空魔王戰場外),乾脆不掉落
  const f=G.world<=3?1:Math.max(0.5,1-0.08*(G.world-3));
  const wr=(hasUpgrade()?0.25:0.35)*f;                 // 各敵人獨立計算:有強化25%、無強化35%
  const hr=0.10*(wlvl===3?1.2:1)*f;                    // 滿強化時生命掉落率x1.2
  if(Math.random()<wr)dropCrate(gx-4,findGroundY(gx)-40);
  if(Math.random()<hr)items.push({kind:'life',x:gx-3,y:findGroundY(gx)-40,vy:-1.6,t:0});
}
function hasUpgrade(){return !(wep==='smg'&&wlvl===1);}
function dropCrate(x,y){
  const pool=['smg','flame','shot'];
  const w=pool.map(t=>t===wep?0.40:0.30);   // 當前彈種 40%、其餘兩種各 30%
  const tot=w[0]+w[1]+w[2];let r=Math.random()*tot,t=pool[0];
  for(let i=0;i<3;i++){if(r<w[i]){t=pool[i];break;}r-=w[i];}
  items.push({kind:'wep',wt:t,x,y,vy:-1.8,t:0});
}
function updateItems(){
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];it.t++;
    it.vy=(it.vy||0)+0.28;it.y+=it.vy;
    if(hitSolid(it.x,it.y,12,12)||tileKind(it.x,it.y+2,12,12,3)&&it.vy>0){it.y-=it.vy;it.vy=0;}
    if(aabb(playerBox(),{x:it.x,y:it.y,w:12,h:12})){
      if(it.kind==='life'){P.lives=Math.min(8,P.lives+1);G.score+=200;burst(it.x+6,it.y+6,'#ff6688',8);}
      else{
        if(it.wt===wep){
          const cap=G.world>=7?4:3; // 7關後三種彈藥都可再升4階
          wlvl=Math.min(cap,wlvl+1);
          G.score+=300;burst(it.x+6,it.y+6,WCOL[it.wt],8);
          G.msg=WNAME[wep]+' Lv'+wlvl;G.msgT=70;
        }else if(hasUpgrade()){
          // 目前已是強化狀態,換成不同武器需要玩家確認,避免非自願被替換
          G.modal={wt:it.wt};items.splice(i,1);continue;
        }else{
          wep=it.wt;wlvl=1;
          G.score+=300;burst(it.x+6,it.y+6,WCOL[it.wt],8);
          G.msg=WNAME[wep]+' Lv'+wlvl;G.msgT=70;
        }
      }
      items.splice(i,1);continue;
    }
    if(boss&&it.t>600)items.splice(i,1); // 只有王關才會限時消失(避免擋視野),小關不會自動消失
  }
}
/* ========== 玩家子彈 ========== */
function updateBullets(){
  for(let i=bul.length-1;i>=0;i--){
    const b=bul[i];b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.life<=0||hitSolid(b.x,b.y,2,2)||b.x<cam.x-20||b.x>cam.x+W+20){bul.splice(i,1);continue;}
    let gone=false;
    for(let j=ens.length-1;j>=0;j--){
      const e=ens[j];
      if(aabb({x:b.x-b.r,y:b.y-b.r,w:b.r*2,h:b.r*2},{x:e.x-3,y:e.y-3,w:e.w+6,h:e.h+6})){
        e.hp-=b.dmg;e.fx=4;hitFx(b);
        if(e.hp<=0)killEnemy(e,j);
        gone=true;break;
      }
    }
    if(!gone&&boss&&bossHit(b))gone=true;
    if(gone)bul.splice(i,1);
  }
  for(let i=ebul.length-1;i>=0;i--){
    const b=ebul[i];b.t++;
    if(b.meteor){ // 10王一階「火流星」:1.5秒未命中則懸停,依序(每顆間隔0.25秒)鎖定玩家當下座標垂直墜落,並於落點地面預警
      if(!b.mHover&&b.t>=90){b.mHover=true;b.vx=0;b.vy=0;}
      else if(b.mHover&&!b.mFalling&&b.t>=90+b.mIdx*15){
        b.mFalling=true;const fx=clamp(P.x+5,20,W-20);b.x=fx;b.vx=0;b.vy=3.2;
        haz(fx-b.r,14*TS-b.r*2,b.r*2,b.r*2,10,40,'#ff2a2a');
      }
    }
    b.x+=b.vx;b.y+=b.vy;
    if(b.g)b.vy+=b.g;
    if(b.t>b.life||b.x<cam.x-40||b.x>cam.x+W+40||b.y<-40||b.y>H+40){
      if(b.mortar)haz(b.x-20,13*TS-14,40,14,10,90,'#ff8a3c'); // 落地後才產生火圈範圍
      ebul.splice(i,1);continue;
    }
    if(!b.noWall&&hitSolid(b.x,b.y,2,2)){ebul.splice(i,1);continue;}
    // 密集火力網:小關(非魔王戰)中,若敵彈周圍同時有夠多己方子彈,視為被彈幕壓制而消除
    if(!boss){
      let near=0;
      for(let k=0;k<bul.length&&near<3;k++){if(Math.hypot(bul[k].x-b.x,bul[k].y-b.y)<14)near++;}
      if(near>=3){addPart(b.x,b.y,rnd(-1,1),rnd(-1,1),'#fff',12);ebul.splice(i,1);continue;}
    }
    if(aabb(playerBox(),{x:b.x-b.r,y:b.y-b.r,w:b.r*2,h:b.r*2})){hurtPlayer();ebul.splice(i,1);}
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.t++;
    if(p.t>p.life)parts.splice(i,1);
  }
}
/* ========== 特殊攻擊(v0.6 改版,使用者 10/31 授權修改機制) ==========
   流程:按下 → 轟炸機 P2 從畫面左緣飛入(相對鏡頭,固定約 3.5 秒)、畫面內目標掛鎖定標記(L2 琥珀)、左下通訊字幕(T3)
   → 第 30 幀起每 4 幀從機腹投放一枚追蹤飛彈(S1:滯空 15 幀後點火)→ 命中才爆炸、才結算。
   一般關:畫面內雜兵各一枚,命中即擊殺(保證);畫面外雜兵在第 30 幀直接結算;另放最多 4 枚示意飛彈飛出畫面右緣即移除。
   魔王關:魔王 4 枚,每枚扣總血量 2%,無視裝甲、命匣、無敵與登場以外的一切規則(最高優先級);召喚物照雜兵規則。
   6 王兩隻都活著時先跳選單(騎士/詠嘆者/平均/取消);7 王 4 枚分給本體與每顆假結晶(各至少 1 枚),
   打到假結晶照觸發原懲罰,傷害仍算本體;4 王隱身時飛彈盤旋等待;魔王登場動畫期間不能施放。 */
const SP_PCT=0.02,SP_SPD=5,SP_TXT=170,SP_LC='#ffb02e';
let spp=[];                                      // 特攻專用視覺粒子(火球、煙、塵浪),不影響任何判定
function spAdd(x,y,vx,vy,life,c,sz,g,gw){if(spp.length<420)spp.push({x,y,vx,vy,life,t:0,c,sz,g,gw});}
function spIntro(){return !!(boss&&boss.alive&&boss.introT>0);}
function spReady(){return G.charge>=100&&!plane&&!G.noSpecial&&!spIntro();}
function fireSpecial(){
  if(!spReady())return;

  launchSpecial(null);
}
function spPick(p){G.modal=null;if(spReady())launchSpecial(p);}
function onScr(x,y,w,h){return x+w>cam.x&&x<cam.x+W&&y+h>cam.y&&y<cam.y+H;}
function launchSpecial(pick){
  G.charge=0;shake(3,20);
  plane={sx:-70,y:26,t:0,txt:'',txtT:0,off:[],bk:null};
  bombs=[];
  for(const e of ens){if(onScr(e.x,e.y,e.w,e.h)){e.spLock=G.t;bombs.push({e,lx:e.x+e.w/2,ly:e.y+e.h/2});}else plane.off.push(e);}
  if(boss&&boss.alive){
    const b=boss;b.spLock=G.t;let keys;
    if(G.world===6){
      if(b.kh>0&&b.ch>0)keys=pick==='k'?['k','k','k','k']:(pick==='c'?['c','c','c','c']:['k','c','k','c']);
      else keys=Array(4).fill(b.kh>0?'k':'c');
    }else if(G.world===7){                       // 本體與每顆假結晶至少各 1 枚,其餘隨機,外觀上看不出真假
      const pool=['core'];for(let i=0;i<b.decoys.length;i++)pool.push('f'+i);
      for(let i=pool.length-1;i>0;i--){const j=ri(0,i);[pool[i],pool[j]]=[pool[j],pool[i]];}
      keys=[0,1,2,3].map(i=>i<pool.length?pool[i]:pool[ri(0,pool.length-1)]);
      b.spKeys=pool.slice();
    }else keys=Array(4).fill('core');
    if(G.world!==7)b.spKeys=[...new Set(keys)];
    for(const k of keys)bombs.push({boss:1,key:k,lx:b.x+b.w/2,ly:b.y+b.h/2});

  }else plane.txt='偵測到敵人：'+ens.length+'名，已全數瞄準。';
  for(let k=0;k<Math.min(4,plane.off.length);k++)bombs.push({dummy:1,ty:cam.y+40+k*50});
  bombs.forEach((m,i)=>{m.ph=0;m.at=30+i*4;m.t=0;m.tr=[];});
}
function updatePlane(){
  if(!plane)return;

  if(plane.sx>W+80&&!bombs.some(m=>m.ph===0))plane=null;

let bombs=[];                                    // v0.6 起為追蹤飛彈清單(沿用變數名,各處重置照舊)
function spTarget(m){                            // 回傳 [x,y];null = 魔王隱身中(盤旋等待)
  if(m.dummy)return [cam.x+W+60,m.ty];
  if(m.e){const e=m.e;if(ens.includes(e)){m.lx=e.x+e.w/2;m.ly=e.y+e.h/2;}return [m.lx,m.ly];} // 目標已死:飛到最後位置自爆
  const b=boss;if(!b||!b.alive)return [m.lx,m.ly];

  const ps=bossParts();let hb=ps.find(p=>p.key===m.key);

  if(!hb)hb=ps.find(p=>p.key==='core')||{x:b.x,y:b.y,w:b.w,h:b.h};

function spBossHit(m){

    else if(k==='c'&&b.ch>0){b.ch=Math.max(0,b.ch-d);if(b.ch<=0)burst(b.cx+9,b.cy+13,'#8affd0',20,3);}

function spBoom(x,y,gnd){                        // X1:火球 + 貼地時左右塵浪

    spAdd(x,y,Math.cos(a)*s,Math.sin(a)*s-0.4,rnd(14,24),i<4?'#fff1b0':(i<7?'#ffb02e':'#ff6a2a'),i<4?3:2,0.03,1);}

}
function spHit(m){

function updateBombs(){
  for(let i=bombs.length-1;i>=0;i--){
    const m=bombs[i];
    if(m.ph===0){                                // 等待投放
      if(!plane||plane.t<m.at)continue;
      m.ph=1;m.t=0;m.x=cam.x+plane.sx+18;m.y=cam.y+plane.y+10;m.vx=1.2;m.vy=0.3;m.a=0.6;continue;}
    m.t++;
    if(m.ph===1){                                // S1:機腹投放,滯空 15 幀後點火
      m.vy+=0.08;m.vx*=0.96;m.x+=m.vx;m.y+=m.vy;m.a=Math.atan2(m.vy,m.vx);
      if(m.t>=15){m.ph=2;m.t=0;m.sp=1.2;spAdd(m.x-1,m.y-1,0,0,3,'#fff1b0',3,0,1);}
      continue;}
    const tg=spTarget(m);
    let want;
    if(tg)want=Math.atan2(tg[1]-m.y,tg[0]-m.x);
    else{want=m.a+0.12;m.t=Math.min(m.t,40);}    // 4 王隱身:原地繞圈,保底計時不累積
    let d=want-m.a;while(d>Math.PI)d-=6.283;while(d<-Math.PI)d+=6.283;
    const tr=tg?(m.t>70?1:0.10+m.t*0.006):0.12;   // 超過 70 幀直接對準,保證命中
    m.a+=clamp(d,-tr,tr);
    m.sp=Math.min(tg?SP_SPD:3,m.sp+0.38);
    m.vx=Math.cos(m.a)*m.sp;m.vy=Math.sin(m.a)*m.sp;m.x+=m.vx;m.y+=m.vy;
    const bx=m.x-Math.cos(m.a)*5,by=m.y-Math.sin(m.a)*5;     // R3:尾焰 + 煙
    if(m.t%2===0)spAdd(bx-1,by-1,rnd(-0.1,0.1),-0.12,18,'#6a6870',2,-0.003,0);
    m.tr.unshift(bx,by);if(m.tr.length>10)m.tr.length=10;
    if(m.dummy){if(m.x>cam.x+W+16)bombs.splice(i,1);continue;}
    if(tg&&Math.hypot(tg[0]-m.x,tg[1]-m.y)<Math.max(6,m.sp+1)){spHit(m);bombs.splice(i,1);}
    else if(m.t>600)bombs.splice(i,1);           // 安全上限
  }
  for(let i=spp.length-1;i>=0;i--){const p=spp[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.t++;if(p.t>=p.life)spp.splice(i,1);}
}
/* ========== 傳送點 ========== */
function spawnPortal(){
  let tx=map.w-6,ty=0;
  for(let y=1;y<map.h;y++){if(isSolid(T(tx,y))||T(tx,y)===3){ty=y;break;}} // 一般地面或單向平台皆可站立生成
  if(!ty){ // 該欄位完全找不到立足點(如無地面王關):向左右鄰欄搜尋,確保傳送門一定落在某塊平台上而非懸空
    search:
    for(let d=1;d<map.w;d++){
      for(const cx of [tx-d,tx+d]){
        if(cx<1||cx>=map.w-1)continue;
        for(let y=1;y<map.h;y++){if(isSolid(T(cx,y))||T(cx,y)===3){tx=cx;ty=y;break search;}}
      }
    }
  }
  if(!ty)ty=map.h-4;
  portal={x:tx*TS-4,y:ty*TS-30,t:0};
}
function updatePortal(){
  if(!portal)return;
  portal.t++;
  if(uE&&aabb(playerBox(),{x:portal.x-8,y:portal.y-6,w:40,h:40})){nextLevel();}
}
/* ========== 亂數關卡生成 ========== */
function genLevel(world,sub){
  const comp=sub;                                  // 1~4 複雜度
  const wTiles=96+sub*16+world*5;
  newMap(wTiles);
  let gy=12, x=0;
  const groundCols=[];                             // 可站立的地表位置
  const plats=[];

  function ground(x0,len,g){
    for(let i=0;i<len;i++){fillR(x0+i,g,x0+i,GH-1,1);groundCols.push({x:x0+i,y:g});}
  }
  // 起始安全區
  ground(0,10,gy);x=10;
  fillR(0,0,0,GH-1,1);

  const kinds=[];
  const push=(k,n)=>{for(let i=0;i<n;i++)kinds.push(k);};
  push('flat',Math.max(1,6-comp));
  push('step',3);
  push('gap',comp);
  push('tower',comp);
  push('wall',Math.max(1,comp-1));
  push('bridge',Math.max(1,comp-1));
  push('trap',world>=7?Math.max(1,comp-1):0);   // 世界7+限定:地面尖刺,考驗跳躍時機

  while(x<wTiles-10){
    const k=pick(kinds);
    if(k==='flat'){
      const L=ri(4,8);ground(x,L,gy);x+=L;
    }else if(k==='step'){
      const dy=ri(1,Math.min(3,1+comp))*(Math.random()<0.5?-1:1);
      gy=clamp(gy+dy,7,12); // 原本5~14,範圍過大導致有時地面極薄(上空幾乎看不到東西)、有時極厚(上方沒有反應空間);縮窄為7~12讓畫面比例更平均
      const L=ri(3,6);ground(x,L,gy);x+=L;
    }else if(k==='gap'){
      const g=ri(2,3);x+=g;
      if(Math.random()<0.45){ // 空中落腳平台
        const py=clamp(gy-ri(2,4),6,12);
        fillR(x-g+1,py,x-g+1,py,3);plats.push({x:x-g+1,y:py});
      }
      const L=ri(3,6);ground(x,L,gy);x+=L;
    }else if(k==='tower'){
      const L=ri(6,9);ground(x,L,gy);
      const p1=clamp(gy-4,3,13),p2=clamp(gy-8,2,13);
      fillR(x+1,p1,x+3,p1,3);plats.push({x:x+2,y:p1});
      fillR(x+L-4,p2,x+L-2,p2,3);plats.push({x:x+L-3,y:p2});
      vineAt(x+Math.floor(L/2),Math.max(0,p2-1),gy-1);   // 藤蔓頂端與平台齊平,不需額外跳躍
      x+=L;
    }else if(k==='wall'){
      const h=ri(3,4+comp),L=ri(2,3);
      const top=clamp(gy-h,7,12); // 下限由2提高到6,避免落地點過高、下方留出過大片沒有內容的坑;範圍再收斂到7~12與整體一致
      fillR(x,top,x+L-1,GH-1,1);
      for(let i=0;i<L;i++)groundCols.push({x:x+i,y:top});
      vineAt(x-1,Math.max(0,top-1),gy-1);   // 藤蔓頂端高於牆面,爬到頂直接跨過,不必額外跳躍
      gy=top;
      x+=L;
      const L2=ri(3,5);ground(x,L2,gy);x+=L2;
      if(Math.random()<0.6){const back=clamp(gy+ri(2,4),7,12);gy=back;const L3=ri(3,5);ground(x,L3,gy);x+=L3;}
    }else if(k==='trap'){ // 尖刺地板一段(寬度縮減30%),上面站不住,逼玩家跳過(踩到扣血)
      const L=ri(1,2);
      ground(x,L,gy+1);
      fillR(x,gy,x+L-1,gy,5);
      x+=L;
      const L2=ri(3,5);ground(x,L2,gy);x+=L2;
    }else{ // bridge:一排單向平台橫跨坑
      const L=ri(5,8);
      for(let i=0;i<L;i++){if(i%2===0){const py=clamp(gy-ri(1,3),6,12);fillR(x+i,py,x+i,py,3);plats.push({x:x+i,y:py});}}
      x+=L;
      const L2=ri(3,5);ground(x,L2,gy);x+=L2;
    }
    if(gy<7)gy=7;if(gy>12)gy=12;
  }
  ground(x,wTiles-x,gy);
  fillR(wTiles-1,0,wTiles-1,GH-1,1);

  // 敵人
  ens=[];items=[];bul=[];ebul=[];hazs=[];parts=[];bombs=[];spp=[];portal=null;boss=null;plane=null;
  const n=Math.min(16,3+sub*2+Math.floor(world*0.8));
  const spots=groundCols.filter(c=>c.x>16&&c.x<wTiles-8);
  const used={};
  for(let i=0;i<n;i++){
    const roll=Math.random();
    let type='grunt';
    if(roll<0.20+comp*0.05)type='runner';
    else if(roll<0.36)type='turret';
    else if(roll<0.52)type='flyer';
    else if(G.world>=3&&roll<0.64)type='skel';
    else if(G.world>=5&&roll<0.74)type='bee';
    else if(G.world>=7&&roll<0.84)type='drone';
    else if(G.world>=7&&roll<0.94)type='mortar';
    let s=pick(spots);let guard=0;
    while(s&&used[s.x]&&guard++<20)s=pick(spots);
    if(!s)continue;used[s.x]=1;
    if(type==='flyer'||type==='bee'||type==='drone'){const fy=clamp(s.y-ri(3,6),2,s.y-1);addEnemy(type,s.x*TS,fy*TS);}
    else addEnemy(type,s.x*TS+2,s.y*TS-14);
  }
  // 出生點
  P.x=32;P.y=(gyStart(groundCols)-1)*TS;P.vx=0;P.vy=0;P.climb=false;P.safeX=P.x;P.safeY=P.y;
  cam.x=0;cam.y=0;G.conveyor=0;G.noSpecial=false;endT=0;
}

function bossDamage(hb,dmg){
  const b=boss;if(!b||!b.alive||b.introT>0||b.invin)return; // b.invin:通用無敵旗標,供魔王特殊招式使用

  x.globalAlpha=1;LT.sky=c;

  const R=L.gr;[c,x]=mkCv(R*2+1,R*2+1);x.fillStyle=L.c;

    if(r<0.32){x.globalAlpha=0.6;x.fillRect(R+i,R+y,1,1);continue;}         // 核心(刻意不到全亮,讓敵彈維持最亮)

function ltBand(img,y,par,drift){ // 霧帶:隨鏡頭視差捲動並緩慢漂移,水平無縫重複

function ltParticles(){

/* ========== 更新 ========== */
function update(){
  G.t++;edges();
  if(G.shakeT>0){G.shakeT--;if(G.shakeT<=0)G.shakeM=0;}
  if(G.msgT>0)G.msgT--;

  if(G.state==='title'){if(anyTap){anyTap=false;G.state='levelselect';G.sT=0;}return;}
  if(G.state==='levelselect'){anyTap=false;G.sT++;return;}
  anyTap=false;

  if(G.state==='intro'){G.sT++;if(G.sT>60)G.state='play';return;}
  if(G.state==='over'){hudEl.style.display='none';if(G.sT<91)G.sT++;return;}
  if(G.state==='finish'){hudEl.style.display='none';G.sT++;if(G.sT>260)toTitle();return;}
  if(G.state==='win'){
    G.sT++;updateParticles();updatePlane();updateBombs();
    if(G.sT>170){G.state='play';spawnPortal();}
    return;
  }
  // play
  if(G.modal||G.paused)return;
  if(sE)fireSpecial();
  updatePlayer();
  updateEnemies();
  updateBullets();
  updateItems();
  updateHazards();
  updatePlane();updateBombs();
  updatePortal();
  if(boss&&boss.alive){
    if(boss.introT>0){boss.introT--;if(boss.introT===0)G.msg='';}
    else{boss.def.upd(boss);bossFlame();if(boss.fx>0)boss.fx--;}
  }
  if(!boss&&ens.length===0&&!portal)spawnPortal();
  if(!boss&&!portal){ // 保底:卡在關尾偵測不到終點時,10 秒後強制開門
    if(P.x>(map.w-14)*TS){endT++;if(endT>600)spawnPortal();}else endT=0;
  }else endT=0;
  // 鏡頭:水平維持原本跟隨;垂直完全固定不動(不逐幀變動,不會抖動)。
  // 手機版一般小關額外套用一個「固定不變」的上緣安全邊界:犧牲畫面最下方一點點地面(通常只是純地板,資訊量低),
  // 換取最上方多一點緩衝,避免裝置本身的畫面元素蓋住剛好在最頂端誕生的高空敵人
  const tx=clamp(P.x+5-W/2,0,Math.max(0,map.w*TS-W));

const FX={

  n:0,                // 本幀發光登記數量(0 時整段泛光跳過)
  gain:1.0,           // 泛光總強度(中等=1.0,之後調整只改這個數字)
  core:0.45,          // 發光源本身的不透明度:越低越不會把彈幕顏色洗白,光暈越淡

function down(dstX,src,w,h){dstX.globalCompositeOperation='copy';dstX.drawImage(src,0,0,w,h);dstX.globalCompositeOperation='source-over';}

function postBloom(){

    bxA.globalCompositeOperation='copy';bxA.globalAlpha=w[0];bxA.drawImage(bl1,0,0);
    bxA.globalCompositeOperation='lighter';

function perfNewSession(){return {start:0,n:0,fSum:0,fMax:0,fMaxAt:'',jMax:0,jMaxAt:'',drop:0,skip:0,

function perfP99(S){ // 由直方圖(每格 0.25ms,上限 100ms)求第 99 百分位

function perfRec(ts,frameDt,jsMs){

  PERF.n++;PERF.fSum+=frameDt;if(frameDt>PERF.fMax)PERF.fMax=frameDt;
  PERF.jSum+=jsMs;if(jsMs>PERF.jMax)PERF.jMax=jsMs;

    perfEl.textContent=

      '【本秒】幀間隔 平均 '+fa.toFixed(1)+' 最差 '+PERF.fMax.toFixed(1)+'  JS 平均 '+ja.toFixed(1)+' 最差 '+PERF.jMax.toFixed(1)+' ms\n'+
      '        發光 '+FX.n+'  敵彈 '+ebul.length+'  粒子 '+parts.length+'\n'+
      '【本場】'+mm+':'+ss+'  共 '+S.n+' 幀'+(S.qMixed?'  ※期間切換過畫質':'')+(S.skip?'  略過 '+S.skip:'')+'\n'+
      '  幀間隔 平均 '+(S.fSum/S.n).toFixed(1)+'  1%低 '+perfP99(S).toFixed(1)+'  最差 '+S.fMax.toFixed(1)+' ms @'+S.fMaxAt+'\n'+
      '  掉幀(>25ms) '+S.drop+' 次 ('+(S.drop/S.n*100).toFixed(2)+'%)  JS 最差 '+S.jMax.toFixed(1)+' ms @'+S.jMaxAt+'\n'+
      '  峰值 發光 '+S.pkG+(S.pkG?'@'+S.pkGAt:'')+'  敵彈 '+S.pkB+(S.pkB?'@'+S.pkBAt:'')+'  粒子 '+S.pkP+(S.pkP?'@'+S.pkPAt:'');
    PERF.t0=ts;PERF.n=0;PERF.fSum=PERF.fMax=PERF.jSum=PERF.jMax=0;

function pScarfSide(ox,oy,f,dy,amp,hs){       // 側面圍巾:9 段由頸後往後飄,前 6 段 2 格粗
  for(let i=1;i<=9;i++){const y=Math.round(7.5+i*dy+Math.sin(G.t*0.12-i*0.7)*i*amp);
    pPix(ox,oy,f,3+hs-i,y,1,i<7?2:1,i<5?'#8e1c2c':'#5a1019');}
}

function pGunH(ox,oy,f,c0,bw){                // 水平槍:機身 c0 起寬 bw,槍管 2 格,第 10~11 列
  const wc=WCOL[wep];

}
function pGun45(ox,oy,f){                     // 斜上 45°:5 段階梯,中間 3 段下緣為武器色
  const D=[[7,10],[8,9],[9,8],[10,7],[11,6]],wc=WCOL[wep];

function pScarfBack(ox,oy){                  // 背面圍巾:垂在背上,下段輕微擺動
  const sw=Math.round(Math.sin(G.t*0.06)*0.8);

function drawPlayer(){
  if(P.inv>0&&((G.t>>1)&1))return;
  const f=P.face,mi=f<0?1:0,ox=Math.round(P.x-1),oy=Math.round(P.y-4),a=aimVec(); // 取整:貼圖與逐格像素對齊
  const GL_BACK=[[3,9],[3,10],[8,9],[8,10]];   // 背面只登記肩胛發光線(耳側也登記時,白髮整顆頭被泛光包住)
  if(P.climb){                                // 攀爬:背面
    if(K.f&&!G.paused)PV.fireT=G.t;
    if(G.t-PV.fireT<20){                      // 射擊中:側臉、單手攀繩、單手持槍(槍不再背在背上)
      ctx.drawImage(PSPR.cf[mi],ox-2,oy-8);
      pScarfBack(ox,oy);
      pPix(ox,oy,f,9,9,1,1,'#394052');pPix(ox,oy,f,10,10,1,1,'#394052');
      pGunH(ox,oy,f,10,3);
      pGlow(ox,oy,f,[[3,5],[3,9],[3,10],[8,9],[8,10]]);
    }else{
      ctx.drawImage(PSPR.cl[Math.floor(P.y/6)&1],ox-2,oy-8); // 依高度換格:停住時不擺動
      pScarfBack(ox,oy);
      pGlow(ox,oy,1,GL_BACK);
    }
    return;
  }
  if(P.inv>56){                               // 受擊:後仰(無敵時間前 16 幀)
    pScarfSide(ox,oy,f,-0.4,0.35,-1);
    ctx.drawImage(PSPR.hu[mi],ox-2,oy-8);
    pGunH(ox,oy,f,9,4);
    pGlow(ox,oy,f,[[2,5],[5,9],[5,10]]);
    return;
  }
  if(a[0]===0){                               // 正上射:背面,槍在頭後方舉起(與子彈出生點對齊)
    px(ox+5,oy-6,2,4,'#3a4150');px(ox+5,oy-2,1,4,'#5b6476');px(ox+6,oy-2,1,4,WCOL[wep]); // v0.5:槍管深灰、機身一側武器色條
    ctx.drawImage(P.onG?PSPR.ug:PSPR.ua,ox-2,oy-8);
    pScarfBack(ox,oy);
    pGlow(ox,oy,1,GL_BACK);
    return;
  }
  let spr,bob=0,ub=0,dy=0.55,amp=0.12;
  if(!P.onG){spr=PSPR.jp[mi];dy=0.75;amp=0.2;}
  else if(Math.abs(P.vx)>0.2){const n=Math.floor(P.anim)&3;spr=PSPR.run[n][mi];bob=(n&1)?-1:0;dy=0.12;amp=0.3;}
  else{ub=(G.t>>5)&1;spr=PSPR.idle[ub][mi];}
  const yo=oy+bob;
  pScarfSide(ox,yo+ub,f,dy,amp,0);
  ctx.drawImage(spr,ox-2,yo-8);
  const gy=yo+ub;
  if(a[1]<0)pGun45(ox,gy,f);                  // 斜上 45°
  else pGunH(ox,gy,f,9,4);
  pGlow(ox,gy,f,[[3,5],[5,9],[5,10]]);
}

function eRects(e){const x=e.x,y=e.y;

  if(e.type==='skel')return[[x,y,12,14,'#d8d2bc',1],[x+3,y+3,6,3,'#2a2a2a']];
  if(e.type==='turret')return[[x,y+4,14,10,'#4a5a6a',1],[x+4,y,6,6,'#7a8a9a'],[x+(e.face>0?12:-2),y+6,4,3,'#222']];

/* v0.6 特攻繪製(使用者選定:標記 L2 琥珀、飛彈 M2、尾跡 R3、爆炸 X1、轟炸機 P2)。鎖定標記不登記發光。 */
const SP_MC=['#c8ccd4','#3a3e48','#8e1c2c','#8e1c2c','#3a3e48','#3a3e48','#2c3038']; // M2 由彈頭往後
function spLockMark(x,y,w,h,t0){
  const age=G.t-t0;if(age>10&&((G.t>>2)&3)===0)return;               // 收合後微閃
  const pad=3+Math.round(Math.max(0,1-age/10)*10),c=SP_LC;
  const cx=Math.round(x+w/2),cy=Math.round(y+h/2),r=Math.round(w/2)+pad+2;
  for(let i=0;i<r;i++){px(cx-r+i,cy-i,1,1,c);px(cx+r-i,cy-i,1,1,c);px(cx-r+i,cy+i,1,1,c);px(cx+r-i,cy+i,1,1,c);}
  px(cx-r-3,cy,3,1,c);px(cx+r+1,cy,3,1,c);px(cx,cy-r-3,1,3,c);px(cx,cy+r+1,1,3,c);px(cx,cy,1,1,c);
}
function drawSpecial(){
  if(bombs.length){
    for(const e of ens)if(e.spLock!=null&&bombs.some(m=>m.e===e))spLockMark(e.x,e.y,e.w,e.h,e.spLock);
    const b=boss;
    if(b&&b.alive&&b.spKeys&&!b.hidden&&bombs.some(m=>m.boss)){
      const ps=bossParts();
      for(const k of b.spKeys){const hb=ps.find(p=>p.key===k)||(k==='core'?{x:b.x,y:b.y,w:b.w,h:b.h}:null);
        if(hb)spLockMark(hb.x,hb.y,hb.w,hb.h,b.spLock);}
    }
  }
  for(const p of spp){const a=Math.max(0,1-p.t/p.life);ctx.globalAlpha=a;px(p.x,p.y,p.sz,p.sz,p.c);ctx.globalAlpha=1;
    if(p.gw)gl(p.x-2,p.y-2,p.sz+4,p.sz+4,p.c,a*FX.core);}           // 煙與塵浪不發光
  for(const m of bombs){if(m.ph===0)continue;
    const ca=Math.cos(m.a),sa=Math.sin(m.a);
    for(let i=0;i<m.tr.length;i+=2){const k=i>>1,s=k<2?2:1;
      px(m.tr[i]-s/2,m.tr[i+1]-s/2,s,s,k<1?'#fff1b0':(k<3?'#ffb02e':'#ff6a2a'));
      if(k<2)gl(m.tr[i]-2,m.tr[i+1]-2,4,4,'#ffb02e',FX.core);}
    for(let i=0;i<SP_MC.length;i++){const x=m.x-ca*i,y=m.y-sa*i;px(x,y,1,1,SP_MC[i]);px(x-sa,y+ca,1,1,SP_MC[i]);}
  }
  if(plane){const x=Math.round(cam.x+plane.sx),y=Math.round(cam.y+plane.y),f=(G.t>>1)&1;
    px(x+2,y+3,40,8,'#3a3e48');px(x+4,y+2,34,1,'#5a606c');px(x+6,y+6,30,2,'#8e1c2c');
    px(x+38,y+4,6,6,'#2c3038');px(x+42,y+6,3,3,'#7ab8ff');
    px(x+12,y-3,14,4,'#2c3038');px(x+14,y-4,8,1,'#4a505c');px(x+12,y+11,16,3,'#2c3038');
    px(x-2,y-2,6,6,'#2c3038');px(x-2,y-3,3,1,'#4a505c');px(x+16,y+11,6,2,'#22252c');
    px(x-6-f*2,y+4,6+f*2,4,'#ff8a2a');px(x-3,y+5,3,2,'#fff1b0');
    gl(x-10,y+2,12,8,'#ff8a2a',FX.core);}                             // 發光層:引擎火
}

   座標換算與遊戲畫面相同(世界座標 − 鏡頭 + 震動,再乘輸出倍率);形狀、大小、顏色與 v0.5 相同,判定未改。
   發光仍由 drawMisc 照常登記,所以光暈保留,只是本體不再被加亮洗白。HUD 與疊層之後才畫,仍蓋在敵彈上。 */
function drawEBulTop(ox,oy){
  if(!ebul.length)return;
  const k=PW/W,kh=PH/H,dx=ox-cam.x,dy=oy-cam.y;
  for(const b of ebul){const X=Math.round(b.x-b.r)+dx,Y=Math.round(b.y-b.r)+dy,D=Math.round(b.r*2);
    octx.fillStyle=b.c;octx.fillRect(Math.round(X*k),Math.round(Y*kh),Math.round(D*k),Math.round(D*kh));
    const cx=Math.round(b.x-1)+dx,cy=Math.round(b.y-1)+dy;
    octx.fillStyle='#fff';octx.fillRect(Math.round(cx*k),Math.round(cy*kh),Math.round(2*k),Math.round(2*kh));}
}

  if(G.state==='win'){
    if(G.sT<70){ctx.globalAlpha=.25+0.2*Math.sin(G.sT*0.4);px(0,0,W,H,'#ffffff');ctx.globalAlpha=1;}
    txt('VICTORY',W/2,90,'#ffe9a0',30,'center',1);
    txt(BOSSES[G.world-1].name+' 擊破',W/2,130,'#d8e2f4',12,'center',1);
  }
  // 魔王警示 / 登場
  if(boss&&boss.alive&&boss.introT>0){
    const t=300-boss.introT;
    if(t<120){ if(((t>>2)&1)){ctx.globalAlpha=.30;px(0,0,W,H,'#ff2a3a');ctx.globalAlpha=1;}
      txt('WARNING',W/2,H/2-10,'#ff4a5a',26,'center',1);}
    else{
      const k=clamp((t-120)/60,0,1);
      ctx.globalAlpha=.55*(1-clamp((t-200)/80,0,1));px(0,H/2-34,W,58,'#05070e');ctx.globalAlpha=1;
      txt(boss.def.name,W/2,H/2-26,'#ffffff',18,'center',1);   // 底板會淡出,登場名稱一律加描邊
      txt(boss.def.en,W/2,H/2-2,'#ff6a7a',10,'center',1);
      txt(boss.def.tag,W/2,H/2+12,'#7a8aa8',8,'center',1);
      ctx.globalAlpha=k;ctx.globalAlpha=1;
    }
  }
  if(G.state==='play'&&(G.paused||G.modal)){
    ctx.globalAlpha=.74;px(0,0,W,H,'#05070e');ctx.globalAlpha=1;
    if(G.modal){
      if(G.modal.choose){
        const [a,b]=G.modal.choose;
        px(W/2-100,H/2-40,200,80,'#0d1626');
        ctx.strokeStyle='#7affd0';ctx.lineWidth=2;ctx.strokeRect(W/2-100,H/2-40,200,80);
        txt('選擇一種彈藥強化(2階)',W/2,H/2-26,'#ffffff',9,'center');
        px(W/2-92,H/2-8,84,26,'#12202e');ctx.strokeStyle=WCOL[a];ctx.strokeRect(W/2-92,H/2-8,84,26);
        txt(WNAME[a],W/2-50,H/2-1,WCOL[a],10,'center');
        px(W/2+8,H/2-8,84,26,'#12202e');ctx.strokeStyle=WCOL[b];ctx.strokeRect(W/2+8,H/2-8,84,26);
        txt(WNAME[b],W/2+50,H/2-1,WCOL[b],10,'center');
      }else if(G.modal.spPick){                 // v0.6:6 王特攻目標選單
        px(W/2-110,H/2-44,220,90,'#0d1626');
        ctx.strokeStyle='#7affd0';ctx.lineWidth=2;ctx.strokeRect(W/2-110,H/2-44,220,90);
        txt('選擇特攻目標',W/2,H/2-34,'#ffffff',10,'center');
        const B=[[W/2-100,'1 騎士','#ffb03c'],[W/2-30,'2 詠嘆者','#8affd0'],[W/2+40,'3 平均打擊','#ffe9a0']];
        for(const [bx,lb,c] of B){px(bx,H/2-8,60,22,'#12202e');ctx.strokeStyle=c;ctx.strokeRect(bx,H/2-8,60,22);
          txt(lb,bx+30,H/2-2,c,9,'center');}
        px(W/2-32,H/2+20,64,18,'#3a1720');ctx.strokeStyle='#ff8a9a';ctx.strokeRect(W/2-32,H/2+20,64,18);
        txt('Esc 取消',W/2,H/2+24,'#ffb0bc',9,'center');
      }else{
        px(W/2-92,H/2-40,184,80,'#0d1626');
        ctx.strokeStyle='#7affd0';ctx.lineWidth=2;ctx.strokeRect(W/2-92,H/2-40,184,80);
        txt('是否替換為',W/2,H/2-30,'#ffffff',10,'center');
        txt(WNAME[G.modal.wt]+' 強化?',W/2,H/2-16,'#ffe9a0',12,'center');
        px(W/2-80,H/2+6,64,22,'#173a2a');ctx.strokeStyle='#7affd0';ctx.strokeRect(W/2-80,H/2+6,64,22);
        txt('替換',W/2-48,H/2+11,'#9fffdc',10,'center');
        px(W/2+16,H/2+6,64,22,'#3a1720');ctx.strokeStyle='#ff8a9a';ctx.strokeRect(W/2+16,H/2+6,64,22);
        txt('取消',W/2+48,H/2+11,'#ffb0bc',10,'center');
      }
    }else{
      txt('已暫停',W/2,H/2-14,'#ffffff',18,'center');
      txt('按 P / Esc 或連點兩下繼續',W/2,H/2+16,'#9fb0d0',10,'center');
    }
  }
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  let sx=0,sy=0;
  if(G.shakeT>0){sx=rnd(-G.shakeM,G.shakeM);sy=rnd(-G.shakeM,G.shakeM);}
  ctx.clearRect(0,0,W,H);
  // 發光層:上一幀有登記才需要清除;座標轉換與遊戲畫面一致(震動+鏡頭)
  gctx.setTransform(1,0,0,1,0,0);
  if(FX.n)gctx.clearRect(0,0,W,H);
  FX.n=0;
  ctx.save();ctx.translate(Math.round(sx),Math.round(sy));
  if(G.state!=='title'&&G.state!=='finish'&&G.state!=='levelselect'){
    drawBG();                                  // 背景視差層維持不縮放、不跟隨鏡頭平移(用自己既有的慢速視差公式)
    const zoom=1; // 鏡頭不再縮放/跟隨,固定1倍,王關與小關行為一致
    ctx.save();ctx.scale(zoom,zoom);ctx.translate(-cam.x,-cam.y);
    gctx.setTransform(zoom,0,0,zoom,Math.round(sx)-cam.x*zoom,Math.round(sy)-cam.y*zoom);
    drawTiles();
    if(boss&&boss.alive&&(boss.introT<=180))boss.def.draw(boss);
    drawItems();drawEnemies();
    drawPlayer();drawFlame();drawBurnTop();drawMuzzle();drawPlayerBullets();  // 主角本體、火焰(Lv4 燃燒剪影蓋在火焰上)、槍口火光、己方子彈先畫
    if(boss&&boss.alive&&boss.introT<=0&&boss.def.fg)boss.def.fg(boss); // 魔王前景警示(需蓋在主角之上)
    drawHazards();                             // 危險區警示/判定一律蓋在主角攻擊特效之上,確保清晰可見
    drawMisc();                                // 子彈(敵彈最後畫,永遠可見)、粒子等
    ctx.restore();
  }
  ctx.restore();
  if(G.state!=='title'&&G.state!=='finish'&&G.state!=='levelselect')drawAtmoTop(); // v0.7 前景薄霧、暈影(像素畫法)
  postComposite();                             // 第一段:遊戲畫面放大 + 倒影/泛光/霧/暈影
  if(G.state!=='title'&&G.state!=='finish'&&G.state!=='levelselect')drawEBulTop(Math.round(sx),Math.round(sy)); // 敵彈:泛光之後,不被洗白
  // 第二段:HUD 與疊層(暫停、過場、選單)畫在泛光之上,沒畫任何方塊就不合成;文字以螢幕解析度畫在最上層(見「文字層」)
  ctx.clearRect(0,0,W,H);PXD=0;TPASS=1;
  if(G.state!=='title'&&G.state!=='finish'&&G.state!=='over'&&G.state!=='levelselect')drawHUD();
  drawOverlays();
  tFlush();TPASS=0;                            // 寫出剩下的面板與文字
}
/* ========== 迴圈 ========== */
let last=0,acc=0;
function loop(ts){
  requestAnimationFrame(loop);
  const j0=performance.now();
  if(!last)last=ts;
  let dt=ts-last;last=ts;
  const rawDt=dt;                               // F3 用:未截斷的實際幀間隔
  if(dt>100)dt=100;
  acc+=dt;
  let guard=0;
  while(acc>=1000/60&&guard++<4){update();acc-=1000/60;}
  render();
  perfRec(ts,rawDt,performance.now()-j0);
}
requestAnimationFrame(loop);
</script>
